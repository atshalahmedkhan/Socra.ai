[project]
name = "socra-api"
version = "0.1.0"
description = "Socra Socratic tutoring backend (FastAPI)."
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/**/*.py" = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
