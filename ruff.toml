target-version = "py312"
exclude = [".cache", ".git", ".pytest_cache", "node_modules"]

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "BLE", "FURB"]

[lint.per-file-ignores]
"model/benchmarks/scripts/*.py" = ["B904", "BLE001", "E701", "E702"]
"model/server/scripts/*.py" = ["E702"]
"backend/app/**/*.py" = ["B008"]
"backend/app/api/health.py" = ["BLE001"]
"backend/app/main.py" = ["B008", "BLE001"]
