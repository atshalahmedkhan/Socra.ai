<!DOCTYPE html>
<!-- gantt.html — Gantt timeline; depends on config.js, js/data.js -->
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self' https://*.supabase.co wss://*.supabase.co;
           script-src 'self' https://cdn.jsdelivr.net;
           style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
           font-src https://fonts.gstatic.com;
           img-src 'self' data:;
           connect-src 'self' https://*.supabase.co wss://*.supabase.co;
           object-src 'none';
           base-uri 'self';
           form-action 'self';">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="Referrer-Policy" content="no-referrer">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research Project — Timeline</title>
<link rel="stylesheet" href="css/style.css">
<style>
.gantt-wrap { background: var(--surface); border: 0.5px solid var(--border-strong); border-radius: var(--radius-lg); padding: 1.75rem; overflow-x: auto; }
.month-axis { display: flex; margin-left: 200px; margin-bottom: 6px; }
.month-lbl { text-align: center; font-size: 11px; font-weight: 600; color: var(--text-3); padding-bottom: 6px; text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 0.5px solid var(--border-strong); }
.phase-row { display: flex; align-items: center; margin-bottom: 9px; }
.phase-lbl { width: 200px; min-width: 200px; font-size: 12px; color: var(--text-2); text-align: right; padding-right: 16px; line-height: 1.3; font-weight: 500; }
.track { flex: 1; position: relative; height: 40px; min-width: 500px; }
.bar { position: absolute; height: 40px; border-radius: 6px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; box-sizing: border-box; overflow: hidden; transition: opacity 0.2s; }
.bar:hover { opacity: 0.85; }
.bar-date { font-size: 11px; font-weight: 500; opacity: 0.9; white-space: nowrap; flex-shrink: 0; }
.grid-line { position: absolute; top: 0; bottom: 0; width: 0.5px; background: var(--border); }
.meeting-pin { position: absolute; top: 50%; transform: translate(-50%,-50%) rotate(45deg); width: 10px; height: 10px; background: #C8391A; border: 2px solid var(--surface); border-radius: 2px; z-index: 5; cursor: pointer; transition: transform 0.15s; }
.meeting-pin:hover { transform: translate(-50%,-50%) rotate(45deg) scale(1.3); }
.meeting-row { display: flex; align-items: center; margin-bottom: 5px; margin-top: 6px; }
.meeting-track { flex: 1; position: relative; height: 24px; min-width: 500px; }
.baseline { position: absolute; top: 50%; left: 0; right: 0; height: 0.5px; background: var(--border-strong); }
.meet-wrap { position: absolute; top: 50%; transform: translate(-50%,-50%); }
.meet-diamond { width: 12px; height: 12px; background: #C8391A; border: 2px solid var(--surface); border-radius: 2px; transform: rotate(45deg); }
.meet-date-lbl { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); font-size: 10px; color: var(--text-3); white-space: nowrap; font-family: 'DM Mono', monospace; }

.legend-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 1.5rem; }
.leg-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); }
.leg-swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

.summary-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px,1fr)); gap: 10px; margin-bottom: 1.5rem; }
.strip-card { background: var(--surface); border: 0.5px solid var(--border-strong); border-radius: var(--radius-md); padding: 10px 14px; }
.strip-num { font-family: 'DM Mono', monospace; font-size: 22px; font-weight: 500; }
.strip-lbl { font-size: 11px; color: var(--text-2); margin-top: 1px; }

.progress-section { margin-top: 1.75rem; }
.progress-title { font-size: 12px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
.progress-row { display: flex; align-items: center; gap: 12px; margin-bottom: 9px; }
.progress-label { font-size: 13px; color: var(--text-2); width: 200px; flex-shrink: 0; font-weight: 500; }
.progress-bar-bg { flex: 1; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
.progress-bar-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease; }
.progress-pct { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text-2); width: 36px; text-align: right; flex-shrink: 0; }
</style>
</head>
<body>

<nav>
  <a class="nav-brand" href="index.html">Research <span>Project</span></a>
  <div class="nav-links">
    <a href="index.html" data-page="overview">Overview</a>
    <a href="calendar.html" data-page="calendar">Calendar</a>
    <a href="gantt.html" data-page="gantt">Timeline</a>
    <a href="chat.html" data-page="chat">Chat</a>
  </div>
  <div class="nav-user">
    <span id="nav-name"></span>
    <button type="button" id="logout-btn" class="btn btn-ghost btn-sm nav-logout-btn">Log out</button>
    <div class="avatar" id="nav-avatar" title="Sign out">YO</div>
  </div>
</nav>

<div class="page">
  <div style="margin-bottom:1.5rem">
    <div class="mono" style="font-size:11px;color:var(--accent);letter-spacing:0.08em;margin-bottom:4px">GANTT TIMELINE</div>
    <h1 class="serif" style="font-size:28px">Project timeline</h1>
  </div>

  <div class="summary-strip">
    <div class="strip-card"><div class="strip-num">May 15</div><div class="strip-lbl">Project start</div></div>
    <div class="strip-card"><div class="strip-num">Aug 20</div><div class="strip-lbl">Final demo</div></div>
    <div class="strip-card"><div class="strip-num" id="pct-done">—%</div><div class="strip-lbl">Overall progress</div></div>
    <div class="strip-card"><div class="strip-num" id="cur-phase-name" style="font-size:14px;line-height:1.3">—</div><div class="strip-lbl">Current phase</div></div>
  </div>

  <div class="gantt-wrap" id="gantt-wrap"></div>

  <div class="progress-section">
    <div class="progress-title">Phase progress</div>
    <div id="progress-list"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="js/data.js"></script>
<script src="js/nav.js"></script>
<script src="js/gantt-page.js"></script>
</body>
</html>
