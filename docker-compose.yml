services:
  api:
    build: ./backend
    env_file: ${SOC_ENDPOINT_ENV_FILE:-.env}
    ports: ["127.0.0.1:8000:8000"]
    networks: [socra-private]
  model-primary:
    build: ./model/server
    env_file: ${SOC_ENDPOINT_ENV_FILE:-.env}
    expose: ["8001"]
    volumes: ["${HF_HOME:-./.cache/huggingface}:/root/.cache/huggingface","./adapters:/models/adapters:ro"]
    healthcheck:
      test: ["CMD","python3","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health',timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks: [socra-private]
  model-fallback:
    profiles: ["fallback"]
    build: ./model/server
    entrypoint: ["/opt/socra/start-fallback.sh"]
    env_file: ${SOC_ENDPOINT_ENV_FILE:-.env}
    expose: ["8002"]
    volumes: ["${HF_HOME:-./.cache/huggingface}:/root/.cache/huggingface","./adapters:/models/adapters:ro"]
    networks: [socra-private]
networks:
  socra-private:
    internal: true
