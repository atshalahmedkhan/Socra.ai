name: Feature request
description: Propose a focused Socra capability or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, real student records, or private research data.
  - type: textarea
    id: problem
    attributes: {label: Problem, description: Describe the user or research problem, not only a proposed solution.}
    validations: {required: true}
  - type: dropdown
    id: user
    attributes:
      label: Affected user type
      options: [Student, Instructor, Researcher, Administrator, Developer, Multiple user types]
    validations: {required: true}
  - type: textarea
    id: outcome
    attributes: {label: Desired outcome}
    validations: {required: true}
  - type: textarea
    id: behavior
    attributes: {label: Proposed behavior}
    validations: {required: true}
  - type: textarea
    id: acceptance
    attributes: {label: Acceptance criteria, placeholder: "- [ ] …"}
    validations: {required: true}
  - type: textarea
    id: security
    attributes: {label: Security and privacy considerations}
    validations: {required: true}
  - type: textarea
    id: database
    attributes: {label: Database impact}
    validations: {required: true}
  - type: textarea
    id: model
    attributes: {label: Model-infrastructure impact}
    validations: {required: true}
  - type: textarea
    id: out_of_scope
    attributes: {label: Out-of-scope items}
    validations: {required: true}
